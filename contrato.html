<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contrato · mfe-perfil</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; }
    h1 { font-size: 18px; }
    .item { font-family: monospace; padding: 4px 0; }
    .ok  { color: #1b7a3e; }
    .mal { color: #c0392b; }
    #montaje { margin-top: 16px; border-top: 1px solid #ddd; padding-top: 12px; }
  </style>
</head>
<body>
  <h1>Prueba de contrato · mfe-perfil</h1>
  <div id="resultados"></div>

  <h3>Salida del montaje</h3>
  <div id="montaje"></div>

  <!-- Partir de cero: debe ir ANTES de cargar perfil.js, porque el script lee el storage al cargarse -->
  <script>sessionStorage.removeItem('saborupc:perfil');</script>
  <script src="perfil.js" data-tokens="https://design-tokens-saborupc.onrender.com/tokens.css"></script>
  <script>
    const resultados = document.getElementById('resultados');
    let ultimoUsuario = null;
    let eventos = 0;

    function check(nombre, condicion) {
      console.assert(condicion, nombre);
      const div = document.createElement('div');
      div.className = 'item ' + (condicion ? 'ok' : 'mal');
      div.textContent = (condicion ? '✓ ' : '✗ ') + nombre;
      resultados.appendChild(div);
    }

    window.addEventListener('usuario:cambio', (e) => { ultimoUsuario = e.detail; eventos++; });

    window.addEventListener('load', () => {
      // 1. Etiqueta definida
      check('customElements.get("mfe-perfil") definido', !!customElements.get('mfe-perfil'));

      // 2. Montaje genera Shadow DOM con form (connectedCallback es síncrono)
      const el = document.createElement('mfe-perfil');
      document.getElementById('montaje').appendChild(el);
      const sombra = el.shadowRoot;
      check('El componente tiene Shadow DOM', !!sombra);
      check('Sin usuario guardado, no emite usuario:cambio al montarse', eventos === 0);

      if (sombra) {
        const form = sombra.querySelector('form');
        check('Shadow DOM contiene un <form>', !!form);
        check('Shadow DOM contiene h2', !!sombra.querySelector('h2'));

        // 3. Aislamiento: una regla global agresiva no debe alcanzar al h2 del Shadow DOM
        const agresivo = document.createElement('style');
        agresivo.textContent = 'h2 { color: rgb(255, 0, 0) !important; }';
        document.head.appendChild(agresivo);
        check('CSS global no afecta al h2 del Shadow DOM',
              getComputedStyle(sombra.querySelector('h2')).color !== 'rgb(255, 0, 0)');
        agresivo.remove();

        if (form) {
          // 4. Submit emite usuario:cambio (dispatchEvent es síncrono)
          form.elements.nombre.value = 'Ana';
          form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));

          check('Se emitió usuario:cambio', !!ultimoUsuario);
          if (ultimoUsuario) {
            check('detail.nombre es string', typeof ultimoUsuario.nombre === 'string');
            check('detail.nombre === "Ana"', ultimoUsuario.nombre === 'Ana');
            check('detail.version === 1',    ultimoUsuario.version === 1);
          }
          // Consumidor antiguo: solo lee nombre (compatibilidad hacia atrás)
          const { nombre } = ultimoUsuario || {};
          check('Un consumidor que solo lee "nombre" sigue funcionando', nombre === 'Ana');

          // 5. Persistencia
          const g = JSON.parse(sessionStorage.getItem('saborupc:perfil') || '{}');
          check('El perfil quedó guardado en sessionStorage', g.nombre === 'Ana');
        }
      }

      // 6. Desmontaje y remontaje: no falla, conserva datos y reanuncia al usuario
      let desmontaOk = true;
      try { el.remove(); } catch (e) { desmontaOk = false; }
      check('Retirar el elemento no lanza errores', desmontaOk);

      ultimoUsuario = null;
      const el2 = document.createElement('mfe-perfil');
      document.getElementById('montaje').appendChild(el2);
      const f2 = el2.shadowRoot && el2.shadowRoot.querySelector('form');
      check('Al remontar conserva el nombre guardado', !!f2 && f2.elements.nombre.value === 'Ana');
      check('Al remontar con usuario, emite usuario:cambio', !!ultimoUsuario && ultimoUsuario.nombre === 'Ana');
    });
  </script>
</body>
</html>
